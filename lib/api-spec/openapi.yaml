openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: calendar
    description: Google Calendar integration operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/google:
    get:
      operationId: googleAuthRedirect
      tags: [calendar]
      summary: Redirect to Google OAuth
      description: Redirects user to Google OAuth consent screen
      responses:
        "302":
          description: Redirect to Google OAuth
    delete:
      operationId: googleAuthDisconnect
      tags: [calendar]
      summary: Disconnect Google Calendar
      description: Removes Google OAuth credentials and clears task calendar links
      responses:
        "200":
          description: Disconnection successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
  /auth/google/callback:
    get:
      operationId: googleAuthCallback
      tags: [calendar]
      summary: Google OAuth callback
      description: Handles OAuth callback from Google and stores tokens
      parameters:
        - name: code
          in: query
          required: true
          schema:
            type: string
      responses:
        "302":
          description: Redirect to frontend with success/error
  /auth/google/status:
    get:
      operationId: googleAuthStatus
      tags: [calendar]
      summary: Google Calendar connection status
      description: Returns whether Google Calendar is connected
      responses:
        "200":
          description: Connection status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoogleAuthStatus"
  /calendar/sync:
    post:
      operationId: calendarSync
      tags: [calendar]
      summary: Manual calendar sync
      description: Manually triggers sync from Google Calendar to tasks
      responses:
        "200":
          description: Sync result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalendarSyncResult"
  /user/timezone:
    get:
      operationId: getUserTimezone
      tags: [calendar]
      summary: Get user timezone
      description: Returns the user's timezone setting
      responses:
        "200":
          description: Timezone setting
          content:
            application/json:
              schema:
                type: object
                properties:
                  timezone:
                    type: string
                    nullable: true
    patch:
      operationId: updateUserTimezone
      tags: [calendar]
      summary: Update user timezone
      description: Updates the user's timezone setting
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                timezone:
                  type: string
              required:
                - timezone
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
  /user/quiet-hours:
    get:
      operationId: getUserQuietHours
      tags: [calendar]
      summary: Get user quiet hours
      description: Returns the user's quiet hours setting
      responses:
        "200":
          description: Quiet hours setting
          content:
            application/json:
              schema:
                type: object
                properties:
                  quietHoursStart:
                    type: number
                    nullable: true
                    minimum: 0
                    maximum: 23
                  quietHoursEnd:
                    type: number
                    nullable: true
                    minimum: 0
                    maximum: 23
    patch:
      operationId: updateUserQuietHours
      tags: [calendar]
      summary: Update user quiet hours
      description: Updates the user's quiet hours setting (hours 0-23, or null to disable)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                quietHoursStart:
                  type: number
                  nullable: true
                  minimum: 0
                  maximum: 23
                quietHoursEnd:
                  type: number
                  nullable: true
                  minimum: 0
                  maximum: 23
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    GoogleAuthStatus:
      type: object
      properties:
        connected:
          type: boolean
        hasAuth:
          type: boolean
        expired:
          type: boolean
      required:
        - connected
        - hasAuth
        - expired
    CalendarSyncResult:
      type: object
      properties:
        synced:
          type: number
        errors:
          type: number
      required:
        - synced
        - errors
    Call:
      type: object
      properties:
        id:
          type: string
        status:
          type: string
          enum: [scheduled, ringing, in-progress, completed, missed, failed]
        startedAt:
          type: string
          format: date-time
        endedAt:
          type: string
          format: date-time
        durationSec:
          type: number
        disconnectedBy:
          type: string
        outcome:
          type: string
          enum: [booked, rescheduled, cancelled, info_gathered, needs_user, failed]
          nullable: true
        outcomeSummary:
          type: string
          nullable: true
        confirmedAt:
          type: string
          format: date-time
          nullable: true
        confirmationRef:
          type: string
          nullable: true
        taskId:
          type: string
          nullable: true
      required:
        - id
        - status
    Query:
      type: object
      properties:
        id:
          type: string
        question:
          type: string
        answer:
          type: string
          nullable: true
        status:
          type: string
          enum: [pending, answered]
        isKnowledgeGap:
          type: boolean
        urgent:
          type: boolean
        callId:
          type: string
          nullable: true
      required:
        - id
        - question
        - status
        - isKnowledgeGap
        - urgent
    Task:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
          nullable: true
        status:
          type: string
          enum: [suggested, open, in_progress, done, cancelled]
        priority:
          type: string
          enum: [low, normal, high]
        dueDate:
          type: string
          format: date-time
          nullable: true
        confidence:
          type: number
          format: float
        source:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
          nullable: true
        kind:
          type: string
          enum: [call, reminder]
        callAttempts:
          type: integer
        lastAttemptAt:
          type: string
          format: date-time
          nullable: true
        nextAttemptAt:
          type: string
          format: date-time
          nullable: true
        schedulerStatus:
          type: string
          enum: [pending, claimed, done, exhausted, stale]
      required:
        - id
        - title
        - status
        - priority
        - confidence
        - source
        - createdAt
        - updatedAt
        - kind
        - callAttempts
        - schedulerStatus
    Contact:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        business:
          type: string
          nullable: true
        category:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        initials:
          type: string
          nullable: true
        color:
          type: string
          nullable: true
        note:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        businessHoursJson:
          type: string
          nullable: true
        online:
          type: boolean
        linkedAccountId:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - online
        - createdAt
        - updatedAt

