# PostgreSQL services disabled - using local Homebrew PostgreSQL instead
# postgres: 16-alpine (main DB on port 5434 via local PostgreSQL 17)
# postgres-test: 16-alpine (test DB on port 5435 via local PostgreSQL 16)
# To enable Docker PostgreSQL again, uncomment the services below and ensure Docker Desktop is working

services:
  postgres-test:
    image: postgres:16-alpine
    container_name: phone-agent-postgres-test
    restart: unless-stopped
    environment:
      POSTGRES_USER: phoneagent
      POSTGRES_PASSWORD: phoneagent_password
      POSTGRES_DB: phone_agent_test
    ports:
      - "5435:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U phoneagent -d phone_agent_test"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_test_data:
