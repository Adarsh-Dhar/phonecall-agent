# PostgreSQL services - using Docker on port 5435
# Both dev and test databases use the same PostgreSQL instance on port 5435

services:
  postgres:
    image: postgres:16-alpine
    container_name: phone-agent-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: phoneagent
      POSTGRES_PASSWORD: phoneagent_password
      POSTGRES_DB: phone_agent
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U phoneagent -d phone_agent"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
