    startCommand: cp prisma/schema.prod.prisma prisma/schema.prisma && cd artifacts/api-server && npx pnpm@latest run start
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_LIVE_MODEL
        sync: false
      - key: EXOTEL_SID
        sync: false
      - key: EXOTEL_API_KEY
        sync: false
      - key: EXOTEL_API_TOKEN
        sync: false
      - key: EXOTEL_SUBDOMAIN
        sync: false
      - key: EXOTEL_CALLER_ID
        sync: false
      - key: EXOTEL_APP_ID
        sync: false
      - key: PUBLIC_WS_URL
        sync: false
      - key: EXOTEL_PASSTHRU_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
