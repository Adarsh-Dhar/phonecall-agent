services:
  - type: web
    name: phone-agent-api-v2
    env: node
    plan: free
    region: oregon
    buildCommand: npx pnpm@latest install && cp prisma/schema.prod.prisma prisma/schema.prisma && npx prisma generate && npx prisma db push --accept-data-loss && npx pnpm run db:seed && cd artifacts/phone-agent && npx pnpm@latest run build && cd ../api-server && npx pnpm@latest run build
    startCommand: cp prisma/schema.prod.prisma prisma/schema.prisma && cd artifacts/api-server && npx pnpm@latest run start
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_LIVE_MODEL
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false
      - key: TWILIO_CLIENT_SECRET
        sync: false
      - key: TWILIO_TRIAL_ACCOUNT
        sync: false
      - key: TWILIO_EMAIL_ADDRESS
        sync: false
      - key: SENDGRID_EMAIL_API_KEY
        sync: false
      - key: SENDGRID_FROM_EMAIL
        sync: false
      - key: EMAIL_INBOUND_SECRET
        sync: false
      - key: EMAIL_INBOUND_DOMAIN
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: SKIP_TWILIO_SIGNATURE_CHECK
        sync: false
      - key: TEST_PHONE_NUMBER
        sync: false
      - key: TEST_PROVIDER_EMAILS
        sync: false
