services:
  - type: web
    name: phone-agent-api-v2
    env: node
    plan: free
    region: oregon
    buildCommand: npx pnpm@latest install && cp prisma/schema.prod.prisma prisma/schema.prisma && npx prisma generate && npx prisma migrate deploy && cd artifacts/phone-agent && npx pnpm@latest run build && cd ../api-server && npx pnpm@latest run build
    startCommand: cp prisma/schema.prod.prisma prisma/schema.prisma && cd artifacts/api-server && npx pnpm@latest run start
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_LIVE_MODEL
        sync: false
      - key: NEBIUS_API_KEY
        sync: false
      - key: NEBIUS_BASE_URL
        sync: false
      - key: NEBIUS_MODEL
        sync: false
      - key: EXOTEL_SID
        sync: false
      - key: EXOTEL_API_KEY
        sync: false
      - key: EXOTEL_API_TOKEN
        sync: false
      - key: EXOTEL_SUBDOMAIN
        sync: false
      - key: EXOTEL_CALLER_ID
        sync: false
      - key: EXOTEL_APP_ID
        sync: false
      - key: PUBLIC_WS_URL
        sync: false
      - key: EXOTEL_PASSTHRU_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: GOOGLE_CALENDAR_ID
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      - key: DEFAULT_TIMEZONE
        value: Asia/Kolkata
      - key: ASK_USER_TIMEOUT_MS
        value: "45000"
      - key: SCHEDULER_STALE_HOURS
        value: "24"
      - key: SCHEDULER_MAX_ATTEMPTS
        value: "3"
      - key: SCHEDULER_CLAIM_TTL_MS
        value: "300000"
      - key: CALL_SCHEDULER_POLL_MS
        value: "30000"
      - key: AUTODIAL_ENABLED
        value: "false"
